<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>library</title>
    <script src="script.js" defer></script>
    <script src="validation.js" defer></script>
  </head>
  <body>
    <header class="header">
      <h1>Library Management Dashboard</h1>
    </header>
    <main class="content">
      <h2>Books Cover</h2>
      <button type="button" id="openbtn">Add Book</button>
      <dialog id="dialog">
        <form novalidate>
          <label for="title">Book Title:</label>
          <input id="title" type="text" name="title" minlength="5" required />
          <label for="author">Author Name:</label>
          <input id="author" type="text" name="author" minlength="4" required />
          <label for="pages">Book Pages:</label>
          <input
            id="pages"
            type="number"
            name="pages"
            min="100"
            max="1000"
            required
          />
          <fieldset>
            <legend>Read or Not(Yes/No)</legend>
            <input id="read-yes" type="radio" name="read" value="yes" checked />
            <label for="read-yes">Yes</label>
            <input id="read-no" type="radio" name="read" value="no" />
            <label for="read-no">NO</label>
          </fieldset>
          <button type="submit" id="submitbtn">Submit</button>
          <button type="button" id="closebtn">Cancel</button>
        </form>
      </dialog>
      <div class="container"></div>
    </main>
  </body>
</html>
